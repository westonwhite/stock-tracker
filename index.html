<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Stock Tracker</title>
<style>
  body{font-family:system-ui,sans-serif;margin:12px;background:#111;color:#eee}
  h1{font-size:1.1rem;margin:0 0 8px}
  .tot{background:#1a1a1a;padding:12px;border-radius:8px;margin-bottom:12px}
  .tot b{font-size:1.4rem}
  .up{color:#3ddc84}.down{color:#ff6b6b}
  button{font-size:1rem;padding:10px 16px;margin:8px 0 12px;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #333}
  th{color:#aaa;font-weight:600}
  td.r,th.r{text-align:right}
  #meta{color:#888;font-size:.8rem;margin-top:8px}
</style>
</head>
<body>
<h1>Nov 5–6 buys</h1>
<div class="tot">
  Value <b id="val">—</b><br>
  Return <b id="ret">—</b> <span id="pct"></span><br>
  Cost <span id="cost">—</span>
</div>
<button id="refresh" type="button">Refresh</button>
<table>
  <thead>
    <tr>
      <th>Ticker</th>
      <th class="r">Price</th>
      <th class="r">Day</th>
      <th class="r">Value</th>
      <th class="r">Gain $</th>
      <th class="r">Gain %</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div id="meta"></div>
<script>
/* Easy-to-edit positions (bought Nov 5–6, 2026) */
const POSITIONS = [
  { ticker: "SNDK", shares: 7,  avgCost: 839.19, totalCost: 5874.36, tv: "NASDAQ:SNDK" },
  { ticker: "OKTA", shares: 25, avgCost: 169.90, totalCost: 4247.54, tv: "NASDAQ:OKTA" },
  { ticker: "DELL", shares: 5,  avgCost: 331.44, totalCost: 1657.18, tv: "NYSE:DELL" },
  { ticker: "MRNA", shares: 6,  avgCost: 242.32, totalCost: 1453.93, tv: "NASDAQ:MRNA" },
  { ticker: "TWST", shares: 8,  avgCost: 120.59, totalCost: 964.74,  tv: "NASDAQ:TWST" },
  { ticker: "TER",  shares: 4,  avgCost: 220.77, totalCost: 883.08,  tv: "NASDAQ:TER" },
  { ticker: "NKE",  shares: 15, avgCost: 38.62,  totalCost: 579.24,  tv: "NYSE:NKE" },
  { ticker: "TSLA", shares: 5,  avgCost: 383.13, totalCost: 1915.66, tv: "NASDAQ:TSLA" },
];

const $ = (id) => document.getElementById(id);
const money = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD" });
const pct = (n) => `${n >= 0 ? "+" : ""}${n.toFixed(2)}%`;
const signed = (n) => `${n >= 0 ? "+" : "-"}${money(Math.abs(n))}`;
const cls = (n) => (n > 0 ? "up" : n < 0 ? "down" : "");

function etNow() {
  return new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York",
    month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit", second: "2-digit",
    hour12: true, timeZoneName: "short"
  }).format(new Date());
}

async function quotes() {
  // Prefer Worker proxy when available
  try {
    const r = await fetch("/api/quotes", { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      return d.quotes || d;
    }
  } catch (_) {}
  const body = {
    symbols: { tickers: POSITIONS.map((p) => p.tv), query: { types: [] } },
    columns: ["close", "change", "change_abs", "description"],
  };
  const r = await fetch("https://scanner.tradingview.com/america/scan", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
    cache: "no-store",
  });
  if (!r.ok) throw new Error("quotes HTTP " + r.status);
  const data = await r.json();
  const out = {};
  for (const row of data.data || []) {
    const t = String(row.s).split(":").pop();
    const [price, dayPct, dayAbs] = row.d;
    out[t] = { price, dayChange: dayAbs, dayChangePct: dayPct };
  }
  return out;
}

async function refresh() {
  const btn = $("refresh");
  btn.disabled = true;
  btn.textContent = "Updating…";
  try {
    const q = await quotes();
    const totalCost = POSITIONS.reduce((s, p) => s + p.totalCost, 0);
    let totalVal = 0;
    const rows = POSITIONS.map((p) => {
      const price = Number(q[p.ticker]?.price);
      const mv = price * p.shares;
      const gain = mv - p.totalCost;
      const gainPct = (gain / p.totalCost) * 100;
      totalVal += mv;
      return {
        ...p,
        price,
        dayChange: Number(q[p.ticker]?.dayChange),
        dayChangePct: Number(q[p.ticker]?.dayChangePct),
        mv,
        gain,
        gainPct,
      };
    }).filter((r) => Number.isFinite(r.price));
    rows.sort((a, b) => b.gainPct - a.gainPct);
    const tg = totalVal - totalCost;
    const tp = (tg / totalCost) * 100;
    $("val").textContent = money(totalVal);
    $("ret").textContent = signed(tg);
    $("ret").className = cls(tg);
    $("pct").innerHTML = `<span class="${cls(tp)}">(${pct(tp)})</span>`;
    $("cost").textContent = money(totalCost);
    $("rows").innerHTML = rows
      .map(
        (r) => `<tr>
      <td><b>${r.ticker}</b><br><span style="color:#888;font-size:.75rem">${r.shares} @ ${money(r.avgCost)}</span></td>
      <td class="r">${money(r.price)}</td>
      <td class="r ${cls(r.dayChange)}">${pct(r.dayChangePct)}</td>
      <td class="r">${money(r.mv)}</td>
      <td class="r ${cls(r.gain)}">${signed(r.gain)}</td>
      <td class="r ${cls(r.gainPct)}">${pct(r.gainPct)}</td>
    </tr>`
      )
      .join("");
    $("meta").textContent = "Updated " + etNow();
  } catch (e) {
    $("meta").textContent = "Refresh failed: " + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Refresh";
  }
}

$("refresh").onclick = refresh;
refresh();
</script>
</body>
</html>
